<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZIVEL LAB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      cursor: default;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000000;
      display: block;
      /* 边缘微弱羽化，防止视频黑底与网页纯黑 #000000 出现矩形接缝 */
      -webkit-mask-image: radial-gradient(circle at center, #000 62%, transparent 98%);
      mask-image: radial-gradient(circle at center, #000 62%, transparent 98%);
    }
  </style>
</head>
<body>
  <main class="stage">
    <video
      id="starVideo"
      src="./star.MP4"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    ></video>
  </main>

  <script>
    const video = document.getElementById('starVideo');

    async function unlockAudio() {
      if (!video.muted) return;
      video.muted = false;
      try {
        await video.play();
      } catch (err) {
        video.muted = true;
      }
    }

    // 尝试直接带声音播放（若浏览器允许则直接有声）
    window.addEventListener('DOMContentLoaded', () => {
      unlockAudio();
    });

    // 若浏览器策略拦截了初始声音，用户一旦点击、触摸或按键即刻开启声音
    ['pointerdown', 'keydown'].forEach((evt) => {
      window.addEventListener(evt, unlockAudio, { once: true });
    });
  </script>
</body>
</html>
