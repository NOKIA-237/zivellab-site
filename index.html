<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZIVEL LAB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      cursor: default;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000000;
      display: block;
      /* 边缘微弱羽化，防止视频黑底与网页纯黑 #000000 出现矩形接缝 */
      -webkit-mask-image: radial-gradient(circle at center, #000 62%, transparent 98%);
      mask-image: radial-gradient(circle at center, #000 62%, transparent 98%);
    }
  </style>
</head>
<body>
  <main class="stage">
    <video
      id="starVideo"
      src="./star.MP4"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    ></video>
  </main>

  <script>
    const video = document.getElementById('starVideo');

    async function startMutedPlay() {
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      try {
        await video.play();
      } catch (err) {
        // 浏览器策略或省电模式拦截时，等待后续媒体事件或用户交互
      }
    }

    async function unlockAudio() {
      if (!video) return;
      video.muted = false;
      video.defaultMuted = false;
      try {
        await video.play();
        ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evt) => {
          window.removeEventListener(evt, unlockAudio);
        });
      } catch (err) {
        video.muted = true;
        try {
          await video.play();
        } catch (e) {}
      }
    }

    ['DOMContentLoaded', 'load', 'pageshow', 'loadedmetadata', 'loadeddata', 'canplay'].forEach((evt) => {
      window.addEventListener(evt, startMutedPlay, { passive: true });
      if (video) {
        video.addEventListener(evt, startMutedPlay, { passive: true });
      }
    });

    startMutedPlay();

    ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evt) => {
      window.addEventListener(evt, unlockAudio, { passive: true });
    });
  </script>
</body>
</html>
